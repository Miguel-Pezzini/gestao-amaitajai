name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: gestao_amaitajai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d gestao_amaitajai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: "3000"
      JWT_SECRET: ci-test-secret-with-at-least-32-chars
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: test-password
      DATABASE_URL: postgresql://admin:changeme@localhost:5432/gestao_amaitajai_test
      DIRECT_URL: postgresql://admin:changeme@localhost:5432/gestao_amaitajai_test
      TEST_DATABASE_URL: postgresql://admin:changeme@localhost:5432/gestao_amaitajai_test
      TEST_BCRYPT_SALT_ROUNDS: "4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Integration tests
        run: npx vitest run

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
