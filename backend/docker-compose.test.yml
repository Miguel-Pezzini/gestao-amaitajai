services:
  postgres_test:
    image: postgres:16-alpine
    container_name: ${POSTGRES_TEST_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-gestao_amaitajai_test}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_TEST_USER:-admin} -d ${POSTGRES_TEST_DB:-gestao_amaitajai_test}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_test_data:
